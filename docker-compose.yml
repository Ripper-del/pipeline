version: '3.8'

services:
  # 1. Uniqreo Bot (Telegram media uniqueizer)
  uniqreo_bot:
    build:
      context: ./uniqreo
      dockerfile: Dockerfile
    container_name: uniqreo_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./uniqreo/tmp_input:/app/tmp_input
      - ./uniqreo/tmp_output:/app/tmp_output
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 2. Ubtbot - Telegram Redirect & Follow-up Bot
  tg_redirect_bot:
    build:
      context: ./ubtbot
      dockerfile: Dockerfile
    container_name: tg_redirect_bot
    command: python bot.py
    restart: unless-stopped
    env_file:
      - .env

  # 3. Ubtbot - WhatsApp Redirect & Follow-up Bot
  wa_redirect_bot:
    build:
      context: ./ubtbot
      dockerfile: Dockerfile
    container_name: wa_redirect_bot
    command: python wa_bot.py
    restart: unless-stopped
    env_file:
      - .env

  # 4. Ubtbot - FastAPI S2S Postback Receiver
  s2s_server:
    build:
      context: ./ubtbot
      dockerfile: Dockerfile
    container_name: s2s_fastapi
    command: uvicorn s2s_server:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
