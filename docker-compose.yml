services:
  # 1. Uniqreo Bot - единственный Telegram-бот-процесс: уникализация медиа,
  # /upload, воронка лидов (/start, дожимы), панель управления в ветках
  # (прогрев/спай/статистика запускает automator.py подпроцессом)
  uniqreo_bot:
    build:
      context: .
      dockerfile: uniqreo/Dockerfile
    container_name: uniqreo_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./uniqreo/tmp_input:/app/tmp_input
      - ./uniqreo/tmp_output:/app/tmp_output
      - ./uniqreo/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 2. WhatsApp Redirect & Follow-up Bot
  wa_redirect_bot:
    build:
      context: ./whatsapp-redirect-bot
      dockerfile: Dockerfile
    container_name: wa_redirect_bot
    command: python bot.py
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./whatsapp-redirect-bot/data:/app/data

  # 3. FastAPI S2S Postback Receiver
  s2s_server:
    build:
      context: ./s2s-postback-server
      dockerfile: Dockerfile
    container_name: s2s_fastapi
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./s2s-postback-server/data:/app/data
